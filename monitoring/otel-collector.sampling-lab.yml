# Explicitly opt-in synthetic lab; never mounted by either local/prod Compose.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 80
    spike_limit_mib: 16
  tail_sampling:
    decision_wait: 1s
    num_traces: 100
    expected_new_traces_per_sec: 10
    decision_cache:
      sampled_cache_size: 1000
      non_sampled_cache_size: 1000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
  batch:
    timeout: 100ms
    send_batch_size: 16

exporters:
  file:
    path: /out/kept.json
    flush_interval: 100ms

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [file]
