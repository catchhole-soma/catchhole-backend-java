# Local, opt-in continuation of a sampled Python Worker trace. No new Java roots.
otel.service.name=catchhole-backend
otel.resource.attributes=deployment.environment.name=local
otel.propagators=tracecontext
otel.traces.sampler=parentbased_always_off
otel.traces.exporter=otlp
otel.exporter.otlp.traces.protocol=http/protobuf
otel.exporter.otlp.traces.endpoint=http://localhost:4318/v1/traces
otel.exporter.otlp.traces.timeout=5000
otel.metrics.exporter=none
otel.logs.exporter=none

# Bounded in-memory delivery; tracing is not a durable audit log.
otel.bsp.schedule.delay=1000
otel.bsp.max.queue.size=1024
otel.bsp.max.export.batch.size=256
otel.bsp.export.timeout=5000

# Only HTTP server and JDBC boundaries, plus context support.
otel.instrumentation.common.default-enabled=false
otel.instrumentation.tomcat.enabled=true
otel.instrumentation.servlet.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.jdbc-datasource.enabled=true
otel.instrumentation.executors.enabled=true
otel.instrumentation.common.controller-telemetry.enabled=false
otel.instrumentation.common.view-telemetry.enabled=false
otel.instrumentation.common.db-statement-sanitizer.enabled=true
otel.instrumentation.http.server.capture-request-headers=
otel.instrumentation.http.server.capture-response-headers=
otel.instrumentation.servlet.experimental.capture-request-parameters=

# The exporter extension additionally removes SQL, URLs, events and free text.
otel.javaagent.logging=simple
