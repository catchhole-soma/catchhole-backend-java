spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

sms:
  provider: ${SMS_PROVIDER:fake}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: catchhole-backend
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
