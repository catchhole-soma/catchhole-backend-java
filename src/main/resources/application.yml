spring:
  application:
    name: CatchHole-Backend
  jpa:
    properties:
      hibernate:
        query:
          hql:
            # 타임라인 정렬에서 JSON 근거의 첫 offset을 DB가 직접 읽도록 Hibernate JSON 함수를 활성화한다.
            json_functions_enabled: true
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

# 개발 기본값. prod에서는 환경변수로 override.
cors:
  allowed-origins:
    - http://localhost:3000

storage:
  s3:
    bucket: ${AWS_S3_BUCKET:catchhole-local}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${AWS_S3_ENDPOINT_OVERRIDE:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

auth:
  jwt:
    # local 개발용 기본값. prod에서는 JWT_SECRET 환경변수로 override.
    secret: local-development-jwt-secret-must-be-at-least-32-bytes-long
    access-token-expiration: 30m
  refresh-token-expiration: 14d
  cookie:
    secure: false
    same-site: Lax
  phone-verification:
    # local/test 기본값. prod에서는 PHONE_VERIFICATION_HASH_SECRET으로 override.
    hash-secret: ${PHONE_VERIFICATION_HASH_SECRET:local-phone-verification-secret-at-least-32-bytes}
    code-expiration: 5m
    resend-interval: 60s
    signup-token-expiration: 10m
    max-attempts: 5

sms:
  provider: ${SMS_PROVIDER:fake}
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender-number: ${SOLAPI_SENDER_NUMBER:}

internal:
  api-key: ${INTERNAL_API_KEY:local-development-internal-api-key}

ai-token:
  default-grant: ${AI_TOKEN_DEFAULT_GRANT:2000000}
  contact-email: ${AI_TOKEN_CONTACT_EMAIL:aicatchhole@gmail.com}
