spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAXIMUM_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MINIMUM_IDLE:2}
      connection-init-sql: "SET TIME ZONE '${TZ:Asia/Seoul}'"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  forward-headers-strategy: framework

auth:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: true
  phone-verification:
    hash-secret: ${PHONE_VERIFICATION_HASH_SECRET:}
  email-verification:
    hash-secret: ${EMAIL_VERIFICATION_HASH_SECRET:}

email:
  provider: ${EMAIL_PROVIDER:smtp}

sms:
  provider: ${SMS_PROVIDER:solapi}

internal:
  api-key: ${INTERNAL_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        deployment:
          include: "*"
          additional-path: server:/healthz
  metrics:
    tags:
      application: catchhole-backend
      environment: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
