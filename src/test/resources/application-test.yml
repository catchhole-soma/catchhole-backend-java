spring:
  flyway:
    enabled: false
  datasource:
    # 서로 다른 Spring Context의 생성·삭제·커밋된 fixture가 다른 테스트 DB에 영향을 주지 않게 한다.
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

sms:
  provider: fake

email:
  provider: fake

work:
  purge:
    scheduling-enabled: false

member:
  withdrawal:
    scheduling-enabled: false

episode:
  source-purge:
    scheduling-enabled: false

world-image:
  cleanup:
    scheduling-enabled: false

analysis:
  relationship-backfill:
    scheduling-enabled: false
  notifications:
    enabled: false
  metrics:
    scheduling-enabled: false

service-usage:
  metrics:
    scheduling-enabled: false

chat:
  metrics-enabled: false
  session-cleanup:
    scheduling-enabled: false
  # 테스트 Context마다 5초 간격으로 돌던 ChatDispatcher.recover()가 PostgreSQL fixture의 TRUNCATE CASCADE와 교착했다(#314 B1).
  # 기동 직후 1회만 돌도록 사실상 끈다. 복구 로직 자체는 전용 테스트가 직접 호출해 검증한다.
  recovery-delay-ms: 3600000

relationship:
  processing:
    scheduling-enabled: false
