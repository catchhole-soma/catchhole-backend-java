spring:
  flyway:
    enabled: false
  datasource:
    # 서로 다른 Spring Context의 생성·삭제·커밋된 fixture가 다른 테스트 DB에 영향을 주지 않게 한다.
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

sms:
  provider: fake

email:
  provider: fake

work:
  purge:
    scheduling-enabled: false

member:
  withdrawal:
    scheduling-enabled: false

episode:
  source-purge:
    scheduling-enabled: false

world-image:
  cleanup:
    scheduling-enabled: false
