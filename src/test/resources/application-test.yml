spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:catchhole-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

sms:
  provider: fake

work:
  purge:
    scheduling-enabled: false

member:
  withdrawal:
    scheduling-enabled: false

episode:
  source-purge:
    scheduling-enabled: false
