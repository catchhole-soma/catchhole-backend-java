name: Deploy API EC2

on:
  workflow_run:
    workflows:
      - Publish Backend Image
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: catchhole-soma/catchhole-backend-java

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      API_EC2_INSTANCE_ID: ${{ secrets.API_EC2_INSTANCE_ID }}
      API_EC2_DEPLOY_PATH: ${{ secrets.API_EC2_DEPLOY_PATH }}
      API_EC2_DEPLOY_USER: ${{ secrets.API_EC2_DEPLOY_USER }}

    steps:
      - name: Validate API deploy settings
        run: |
          set -euo pipefail

          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION secret is required."
            exit 1
          fi

          if [ -z "$API_EC2_INSTANCE_ID" ]; then
            echo "::error::API_EC2_INSTANCE_ID secret is required."
            exit 1
          fi

          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$DEPLOY_AWS_ACCESS_KEY_ID" ] || [ -z "$DEPLOY_AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "::error::Set AWS_ROLE_TO_ASSUME for OIDC or set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: catchhole-api-github-deploy

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy API server with AWS Systems Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API_EC2_DEPLOY_PATH="${API_EC2_DEPLOY_PATH:-/opt/catchhole}"
          API_EC2_DEPLOY_USER="${API_EC2_DEPLOY_USER:-ubuntu}"
          DEPLOY_SHA='${{ github.event.workflow_run.head_sha }}'

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publish workflow returned an invalid commit SHA."
            exit 1
          fi

          DEPLOY_SHORT_SHA="${DEPLOY_SHA:0:7}"
          RAW_BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEPLOY_SHA/deploy"
          BACKEND_IMAGE="$REGISTRY/$IMAGE_NAME:sha-$DEPLOY_SHORT_SHA"

          cat > /tmp/catchhole-api-deploy.sh <<EOF
          # AWS-RunShellScript executes this block with /bin/sh, so keep it POSIX-compatible.
          set -eu

          DEPLOY_PATH='$API_EC2_DEPLOY_PATH'
          DEPLOY_USER='$API_EC2_DEPLOY_USER'
          RAW_BASE='$RAW_BASE'
          BACKEND_IMAGE='$BACKEND_IMAGE'

          mkdir -p "\$DEPLOY_PATH"
          curl -fsSL "\$RAW_BASE/compose.api.prod.yml" -o "\$DEPLOY_PATH/compose.api.prod.yml"
          curl -fsSL "\$RAW_BASE/Caddyfile" -o "\$DEPLOY_PATH/Caddyfile"
          test -f "\$DEPLOY_PATH/api.env"
          grep -q '^BACKEND_IMAGE=' "\$DEPLOY_PATH/api.env"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=\$BACKEND_IMAGE|" "\$DEPLOY_PATH/api.env"
          chown "\$DEPLOY_USER:\$DEPLOY_USER" "\$DEPLOY_PATH/compose.api.prod.yml" "\$DEPLOY_PATH/Caddyfile" "\$DEPLOY_PATH/api.env"

          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml config --quiet"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml pull"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml up -d"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml ps"

          for i in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null && curl -fsS https://api.catchhole.com/actuator/health; then
              exit 0
            fi

            echo "API health check failed. Retrying in 5 seconds... (\$i/30)"
            sleep 5
          done

          echo "API health check failed after retries. Printing container logs."
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml logs --tail=200 backend"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file api.env -f compose.api.prod.yml logs --tail=100 caddy"
          exit 1
          EOF

          jq -n --rawfile script /tmp/catchhole-api-deploy.sh '{commands: [$script]}' > /tmp/ssm-api-parameters.json

          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::notice::Skipping superseded publish run for $DEPLOY_SHA; current main is $CURRENT_MAIN_SHA."
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$API_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CatchHole API from GitHub Actions run ${GITHUB_RUN_ID}" \
            --parameters file:///tmp/ssm-api-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "AWS Systems Manager command id: $COMMAND_ID"

          WAIT_STATUS=1
          for i in $(seq 1 180); do
            INVOCATION_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$API_EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$INVOCATION_STATUS" in
              Success)
                WAIT_STATUS=0
                break
                ;;
              Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$API_EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json

          exit "$WAIT_STATUS"
