name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rds-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/monitoring/rds-backup-exporter/requirements.txt

      - name: Install exporter dependencies
        run: python -m pip install -r deploy/monitoring/rds-backup-exporter/requirements.txt

      - name: Test RDS API collection and cached metrics
        run: python -m unittest discover -s deploy/monitoring/rds-backup-exporter -p 'test_*.py' -v

      - name: Test alert rules with production Prometheus version
        run: python -m unittest discover -s deploy/monitoring/rds-backup-alerts -p 'test_*.py' -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test bootJar

      - name: Verify tracing extension and production entrypoint
        run: |
          ./gradlew --no-daemon -p monitoring/java-agent test jar prepareAgent
          python3 scripts/tracing/verify_backend_entrypoint.py

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
