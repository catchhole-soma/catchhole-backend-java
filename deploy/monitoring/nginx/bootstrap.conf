# 인증서 없이 시작한다. 최초 발급 중에는 Grafana 로그인 화면을 HTTP로 제공하지 않는다.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name monitoring.catchhole.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
