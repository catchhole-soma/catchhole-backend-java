extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 5s
    sending_queue:
      enabled: true
      sizer: requests
      queue_size: 100
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      # Tail sampling remains OFF. The SDK's head decision has already happened.
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
