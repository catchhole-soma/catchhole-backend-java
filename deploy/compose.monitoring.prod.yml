name: catchhole-monitoring-prod

services:
  nginx:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    logging:
      driver: journald
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${MONITORING_NGINX_CONFIG:-./monitoring/nginx/bootstrap.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - acme_webroot:/var/www/certbot:ro
      - letsencrypt_data:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v5.8.0
    profiles:
      - maintenance
    logging:
      driver: journald
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    command:
      - renew
      - --cert-name
      - monitoring.catchhole.com
      - --non-interactive
      - --no-random-sleep-on-renew
    volumes:
      - acme_webroot:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt

  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    logging:
      driver: journald
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - type: bind
        source: ${PROMETHEUS_TARGETS_FILE:-./monitoring/targets/catchhole-backend.json}
        target: /etc/prometheus/targets/catchhole-backend.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROMETHEUS_WORKER_TARGETS_DIR:-./monitoring/targets/workers}
        target: /etc/prometheus/worker-targets
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    logging:
      driver: journald
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: monitoring.catchhole.com
      GF_SERVER_ROOT_URL: https://monitoring.catchhole.com/
      GF_SERVER_PROTOCOL: http
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
  acme_webroot:
  letsencrypt_data:
