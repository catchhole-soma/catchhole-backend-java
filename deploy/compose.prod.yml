name: catchhole

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "${BACKEND_JAVA_OPTS} -Duser.timezone=${APP_TIMEZONE:-Asia/Seoul}"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_TOKEN_DEFAULT_GRANT: ${AI_TOKEN_DEFAULT_GRANT:-2000000}
      AI_TOKEN_CONTACT_EMAIL: ${AI_TOKEN_CONTACT_EMAIL:-aicatchhole@gmail.com}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT_OVERRIDE: ${AWS_S3_ENDPOINT_OVERRIDE}
      SMS_PROVIDER: ${SMS_PROVIDER:-solapi}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER}
      PHONE_VERIFICATION_HASH_SECRET: ${PHONE_VERIFICATION_HASH_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  ai-worker:
    image: ${AI_IMAGE}
    restart: unless-stopped
    stop_grace_period: 210s
    deploy:
      replicas: ${AI_WORKER_PROCESS_COUNT:-2}
    depends_on:
      - backend
      - postgres
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-5.6-terra}
      LLM_SUBJECT_RESOLUTION_MODEL: ${LLM_SUBJECT_RESOLUTION_MODEL:-gpt-5.6-luna}
      LLM_COMPARISON_MODEL: ${LLM_COMPARISON_MODEL:-gpt-5.6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      OPENAI_RESPONSES_API_URL: ${OPENAI_RESPONSES_API_URL}
      LLM_HTTP_MAX_RETRIES: ${LLM_HTTP_MAX_RETRIES:-3}
      LLM_HTTP_RETRY_BASE_SECONDS: ${LLM_HTTP_RETRY_BASE_SECONDS:-2}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-5}
      LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-5}
      AI_WORKER_BLOCKING_MAX_WORKERS: ${AI_WORKER_BLOCKING_MAX_WORKERS:-3}
      AI_WORKER_IDLE_SLEEP_SECONDS: ${AI_WORKER_IDLE_SLEEP_SECONDS:-5}
      AI_WORKER_SHUTDOWN_GRACE_SECONDS: ${AI_WORKER_SHUTDOWN_GRACE_SECONDS:-180}
      EMBEDDING_GENERATION_ENABLED: ${EMBEDDING_GENERATION_ENABLED:-false}
      SPRING_INTERNAL_API_BASE_URL: http://backend:8080
      SPRING_INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  ai-world-comparison-worker:
    image: ${AI_IMAGE}
    restart: unless-stopped
    stop_grace_period: 210s
    depends_on:
      - backend
      - postgres
    command: ["python", "scripts/run_analysis_worker.py", "--worker-kind", "world-comparison"]
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-5.6-terra}
      LLM_SUBJECT_RESOLUTION_MODEL: ${LLM_SUBJECT_RESOLUTION_MODEL:-gpt-5.6-luna}
      LLM_COMPARISON_MODEL: ${LLM_COMPARISON_MODEL:-gpt-5.6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      OPENAI_RESPONSES_API_URL: ${OPENAI_RESPONSES_API_URL}
      LLM_HTTP_MAX_RETRIES: ${LLM_HTTP_MAX_RETRIES:-3}
      LLM_HTTP_RETRY_BASE_SECONDS: ${LLM_HTTP_RETRY_BASE_SECONDS:-2}
      AI_WORKER_CONCURRENCY: 1
      LLM_MAX_CONCURRENT_REQUESTS: 1
      AI_WORKER_BLOCKING_MAX_WORKERS: 1
      AI_WORKER_IDLE_SLEEP_SECONDS: ${AI_WORKER_IDLE_SLEEP_SECONDS:-5}
      AI_WORKER_SHUTDOWN_GRACE_SECONDS: ${AI_WORKER_SHUTDOWN_GRACE_SECONDS:-180}
      EMBEDDING_GENERATION_ENABLED: "false"
      SPRING_INTERNAL_API_BASE_URL: http://backend:8080
      SPRING_INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  ai-character-comparison-worker:
    image: ${AI_IMAGE}
    restart: unless-stopped
    stop_grace_period: 210s
    depends_on:
      - backend
      - postgres
    command: ["python", "scripts/run_analysis_worker.py", "--worker-kind", "character-comparison"]
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-5.6-terra}
      LLM_SUBJECT_RESOLUTION_MODEL: ${LLM_SUBJECT_RESOLUTION_MODEL:-gpt-5.6-luna}
      LLM_COMPARISON_MODEL: ${LLM_COMPARISON_MODEL:-gpt-5.6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      OPENAI_RESPONSES_API_URL: ${OPENAI_RESPONSES_API_URL}
      LLM_HTTP_MAX_RETRIES: ${LLM_HTTP_MAX_RETRIES:-3}
      LLM_HTTP_RETRY_BASE_SECONDS: ${LLM_HTTP_RETRY_BASE_SECONDS:-2}
      AI_WORKER_CONCURRENCY: 1
      LLM_MAX_CONCURRENT_REQUESTS: 1
      AI_WORKER_BLOCKING_MAX_WORKERS: 1
      AI_WORKER_IDLE_SLEEP_SECONDS: ${AI_WORKER_IDLE_SLEEP_SECONDS:-5}
      AI_WORKER_SHUTDOWN_GRACE_SECONDS: ${AI_WORKER_SHUTDOWN_GRACE_SECONDS:-180}
      EMBEDDING_GENERATION_ENABLED: "false"
      SPRING_INTERNAL_API_BASE_URL: http://backend:8080
      SPRING_INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-Asia/Seoul}"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
