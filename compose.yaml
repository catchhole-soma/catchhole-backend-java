services:
  postgres:
    image: 'pgvector/pgvector:0.8.2-pg16'
    command: ['postgres', '-c', 'timezone=${APP_TIMEZONE:-Asia/Seoul}']
    environment:
      - 'TZ=${APP_TIMEZONE:-Asia/Seoul}'
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '15432:5432'
    labels:
      org.springframework.boot.service-connection: postgres
  redis:
    image: 'redis:7.4.10-alpine3.21'
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'noeviction', '--save', '']
    ports:
      - '16379:6379'
    labels:
      org.springframework.boot.service-connection: redis
